<!-- ============================================
     TELA: TÍTULO
     ============================================ -->
<div id="screen-title" class="screen active">
  <div class="title-container">
    <h1>CHRONICLES</h1>
    <p class="subtitle">Sandbox &mdash; Sua história, suas escolhas</p>
    <div class="title-buttons">
      <button class="btn btn-accent" onclick="App.showEraCreator()">
        <i class="fa-solid fa-wand-magic-sparkles"></i> &nbsp;Criar Nova Era
      </button>
      <button class="btn" onclick="App.showCountryPicker()">
        <i class="fa-solid fa-earth-americas"></i> &nbsp;Mundo 2026
      </button>
      <button class="btn" onclick="App.showTutorial()">
        <i class="fa-solid fa-book-open"></i> &nbsp;Como Jogar
      </button>
      <button class="btn" onclick="App.showAchievements()">
        <i class="fa-solid fa-trophy"></i> &nbsp;Conquistas
      </button>
      <button class="btn" onclick="App.showSettings()">
        <i class="fa-solid fa-gear"></i> &nbsp;Configurações
      </button>
      <button class="btn" onclick="App.showSaveSlots()">
        <i class="fa-solid fa-floppy-disk"></i> &nbsp;Salvar/Carregar
      </button>
    </div>
  </div>
</div>

<!-- ============================================
     TELA: CRIADOR DE ERA (IA)
     ============================================ -->
<div id="screen-era-creator" class="screen">
  <div class="scenarios-header">
    <h2><i class="fa-solid fa-wand-magic-sparkles"></i> &nbsp;Criar Nova Era</h2>
    <button class="btn-back" onclick="App.showScreen('title')">
      <i class="fa-solid fa-arrow-left"></i> Voltar
    </button>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;padding:1rem;overflow-y:auto;">
    <p style="color:var(--text-secondary);margin-bottom:1rem;text-align:center;">
      Digite qualquer combinação de país/ano/era e a IA criará o cenário completo
    </p>
    <div class="form-group">
      <label>Comando da Era</label>
      <input type="text" id="era-command" placeholder="Ex: EUA 1986, Brasil 1964, URSS 1991..." 
             style="width:100%;padding:1rem;background:var(--bg-glass);border:1px solid var(--border-glass);border-radius:10px;color:var(--text-primary);font-size:1.1rem;font-family:var(--font-terminal);">
    </div>
    <button class="btn btn-accent" onclick="App.createEra()" style="margin:1rem 0;min-height:50px;font-size:1.1rem;">
      <i class="fa-solid fa-sparkles"></i> &nbsp;Gerar Cenário com IA
    </button>
    
    <div style="margin-top:1rem;">
      <p style="color:var(--text-muted);font-size:0.8rem;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;">Sugestões rápidas:</p>
      <div style="display:flex;flex-wrap:wrap;gap:0.5rem;">
        ${EraCreator?.getSuggestions?.().map(s => `<button class="btn-back" style="font-size:0.75rem;padding:0.5rem 0.75rem;" onclick="document.getElementById('era-command').value='${s.split('—')[0].trim()}">${s.split('—')[0].trim()}</button>`).join('') || ''}
      </div>
    </div>
  </div>
</div>

<!-- ============================================
     TELA: PICKER DE PAÍSES
     ============================================ -->
<div id="screen-country-picker" class="screen">
  <div class="scenarios-header">
    <h2><i class="fa-solid fa-earth-americas"></i> &nbsp;Escolha sua Nação</h2>
    <button class="btn-back" onclick="App.showScreen('title')">
      <i class="fa-solid fa-arrow-left"></i> Voltar
    </button>
  </div>
  <div id="country-picker-list" style="flex:1;overflow-y:auto;padding:1rem;">
    <!-- Países gerados via JS -->
  </div>
</div>
